[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanization"
version = "0.2.0"
description = "Experiments on stylometry, semantic preservation and AI-text detection"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["humanization*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

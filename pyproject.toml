[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanization-thesis"
version = "0.1.0"
description = "Experiments on stylometry, semantic preservation and AI-text detection"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["humanization_paths"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stylometry*", "semantics*", "humanizers*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
